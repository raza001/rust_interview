    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              rust: {
                50: '#fff7ed',
                100: '#ffedd5',
                200: '#fed7aa',
                300: '#fdba74',
                400: '#fb923c',
                500: '#f97316', // Orange-500
                600: '#ea580c',
                700: '#c2410c',
                800: '#9a3412',
                900: '#7c2d12',
              },
              dark: {
                bg: '#09090b', // Zinc-950
                card: '#18181b', // Zinc-900
                border: '#27272a', // Zinc-800
                text: '#e4e4e7',
                muted: '#a1a1aa'
              }
            },
            fontFamily: {
              sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', "Segoe UI", 'Roboto', 'sans-serif'],

            }
          }
        }

    <style>
      body {
        background-color: #0f1012;
        color: #e2e8f0;
        /* Rich mesh background */
        background-image: 
          radial-gradient(circle at 10% 20%, rgba(249, 115, 22, 0.08), transparent 30%), 
          radial-gradient(circle at 90% 80%, rgba(59, 130, 246, 0.04), transparent 30%),
          radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.01), transparent 50%);
        background-attachment: fixed;
      }
      
      /* Smooth scroll */
      html {
        scroll-behavior: smooth;
      }

      /* Refined Scrollbar */
      .custom-scrollbar::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.1); 
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #27272a; 
        border-radius: 4px;
        border: 2px solid #0f1012;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #3f3f46; 
      }
      
      /* Text Selection */
      ::selection {
        background: rgba(249, 115, 22, 0.2);
        color: #fff;
      }
    </style>
